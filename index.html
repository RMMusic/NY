<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новорічний Таймер - vClock Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;600;800&family=Rubik+Bubbles&display=swap" rel="stylesheet">

<style>
    body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden; background-color: #000;
        /* Playpen Sans для загального тексту */
        font-family: 'Playpen Sans', cursive;
    }
    
    #canvas { position: absolute; top: 0; left: 0; z-index: 1; }
    
    .content {
        position: relative; z-index: 2;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        height: 100vh; color: #ffa500;
        text-align: center; user-select: none;
        transition: transform 0.3s ease, opacity 1s ease;
    }
    
    .title { 
        font-size: 2.5rem; 
        margin-bottom: 20px; 
        font-weight: 400; 
    }
    
    /* ТІЛЬКИ ДЛЯ ТАЙМЕРА - Rubik Bubbles */
    .timer { 
        font-family: 'Rubik Bubbles', cursive;
        font-size: 12vw; /* Збільшив розмір, бо Bubbles виглядає компактніше */
        line-height: 1; 
        margin-bottom: 30px; 
        letter-spacing: 3px;
        color: #ffa500;
        /* Додаємо легке світіння, щоб "бульбашки" були об'ємнішими */
        text-shadow: 4px 4px 0px rgba(0,0,0,0.5), 0 0 20px rgba(255, 165, 0, 0.4);
    }
    
    .date { 
        font-size: 2rem; 
        letter-spacing: 1px; 
        text-transform: uppercase; 
        font-weight: 600;
        color: rgba(255, 165, 0, 0.8);
    }

    #wishes {
        position: absolute; z-index: 3; color: #fff;
        font-family: 'Playpen Sans', cursive;
        font-size: 1.4rem; 
        font-weight: 400;
        text-shadow: 0 0 10px rgba(255,255,255,0.4);
        opacity: 0; transition: opacity 1.5s ease;
        max-width: 450px; padding: 25px; pointer-events: none;
        line-height: 1.5;
    }
    #wishes.show { opacity: 1; }

    .celebration-text {
        position: absolute; z-index: 5;
        font-family: 'Rubik Bubbles', cursive; /* Святкові вигуки теж будуть бульбашками */
        animation: popOut 3.5s forwards; pointer-events: none;
        text-align: center; white-space: nowrap;
    }
    
    @keyframes popOut {
        0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
        15% { transform: scale(1.2) rotate(5deg); opacity: 1; }
        85% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1.4); opacity: 0; }
    }

    /* Кнопки */
    .controls-wrapper { position: absolute; top: 0; right: 0; width: 300px; height: 150px; z-index: 100; }
    .controls {
        position: absolute; top: 20px; right: 20px; display: flex; gap: 10px;
        opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
    }
    .controls-wrapper:hover .controls, .controls.active { opacity: 1; pointer-events: auto; }
    
    .btn {
        background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 165, 0, 0.5);
        color: #ffa500; width: 45px; height: 45px; cursor: pointer;
        border-radius: 50%; display: flex; align-items: center;
        justify-content: center; font-size: 20px; transition: 0.3s;
        font-family: Arial, sans-serif;
    }
    .btn:hover { background: rgba(255, 165, 0, 0.4); border-color: #ffa500; }
    .btn-text { border-radius: 10px; width: auto; padding: 0 15px; font-size: 14px; font-weight: bold; }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }

    @media (max-width: 768px) {
        .timer { font-size: 20vw; }
        .title { font-size: 1.8rem; }
        .date { font-size: 1.1rem; }
        #wishes { font-size: 1rem; max-width: 90%; left: 5% !important; bottom: 8% !important; }
    }
</style>
</head>
<body>

            <button class="btn" onclick="changeZoom(1)">+</button>
            <button class="btn" onclick="toggleFullScreen()">

        function getNextNewYear() { return new Date(`January 1, ${new Date().getFullYear() + 1} 00:00:00`).getTime(); }
        let targetDate = getNextNewYear();

        function startCelebration() {
            if (isCelebrating) return;
            isCelebrating = true;
            document.getElementById('main-content').style.opacity = '0';
            const t = translations[currentLang];
            const interval = setInterval(() => {
                const div = document.createElement('div');
                div.className = 'celebration-text';
                const name = t.names[Math.floor(Math.random() * t.names.length)];
                const phrase = t.celebrate[Math.floor(Math.random() * t.celebrate.length)];
                div.innerText = `${phrase}\n${name}!`;
                div.style.left = Math.random() * 70 + 15 + '%';
                div.style.top = Math.random() * 70 + 15 + '%';
                div.style.color = `hsl(${Math.random() * 360}, 80%, 65%)`;
                div.style.fontSize = Math.random() * 2 + 1.2 + 'rem';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 3500);
            }, 250);
            setTimeout(() => { clearInterval(interval); isCelebrating = false; targetDate = getNextNewYear(); document.getElementById('main-content').style.opacity = '1'; }, 180000);
        }

        function updateClock() {
            const diff = targetDate - new Date().getTime();
            if (diff <= 0) { startCelebration(); return; }
            const h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            updateDateDisplay();
        }

        let nIdx = 0, wIdx = 0;
        function showNextWish() {
            if (isCelebrating) return;
            const wishEl = document.getElementById('wishes'), t = translations[currentLang];
            const corners = [{top:'60px',left:'60px',right:'auto',bottom:'auto',textAlign:'left'},{top:'60px',right:'60px',left:'auto',bottom:'auto',textAlign:'right'},{bottom:'60px',left:'60px',top:'auto',right:'auto',textAlign:'left'},{bottom:'60px',right:'60px',top:'auto',left:'auto',textAlign:'right'}];
            const c = corners[Math.floor(Math.random()*4)];
            Object.assign(wishEl.style, { top: c.top, left: c.left, right: c.right, bottom: c.bottom, textAlign: c.textAlign });
            wishEl.innerText = `${t.prefix} ${t.names[nIdx]}:\n${t.wishes[wIdx]}`;
            wishEl.classList.add('show');
            setTimeout(() => wishEl.classList.remove('show'), 9000);
            nIdx = (nIdx+1)%t.names.length; wIdx = (wIdx+1)%t.wishes.length;
        }

        setInterval(showNextWish, 30000); setTimeout(showNextWish, 3000);
        const controls = document.getElementById('ui-controls'); let hTime;
        function resetUI() { controls.classList.add('active'); clearTimeout(hTime); hTime = setTimeout(() => controls.classList.remove('active'), 10000); }
        window.addEventListener('mousemove', resetUI);
        function changeZoom(d) { currentZoomIndex = Math.max(0, Math.min(zoomLevels.length-1, currentZoomIndex+d)); document.getElementById('main-content').style.transform = `scale(${zoomLevels[currentZoomIndex]})`; }
        function updateDateDisplay() {
            const t = translations[currentLang], d = new Date(targetDate);
            document.getElementById('date-display').innerText = `${t.days[d.getDay()]} - ${d.getDate()} ${t.months[d.getMonth()]} ${d.getFullYear()}`;
            document.getElementById('ui-title').innerText = t.title; document.getElementById('lang-btn').innerText = t.btn;
        }
        function toggleLanguage() { currentLang = currentLang === 'uk' ? 'en' : 'uk'; updateDateDisplay(); }
        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'); let particles = [];
        function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; particles = []; for(let i=0; i<180; i++) particles.push(new Particle()); }
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.size = Math.random()*2+2; this.speedY = Math.random()*0.3+0.1; this.angle = Math.random()*Math.PI*2; this.spin = Math.random()*0.02+0.01; this.color = `hsla(${Math.random()*360},50%,50%,0.3)`; }
            update() { this.y -= this.speedY; this.x += Math.sin(this.angle)*0.4; this.angle += this.spin; if (this.y < -10) this.y = canvas.height + 10; }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
        }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        window.addEventListener('resize', initCanvas); initCanvas(); animate(); setInterval(updateClock, 1000); updateClock();
    </script>
</body>
